<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skyping — Secure Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #111111;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --green: #4ade80;
      --text: #f5f5f5;
      --muted: #777;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', sans-serif;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo {
      color: var(--green);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }
    .connect-wrap {
      align-items: center;
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      padding: 2.5rem 1.25rem;
      text-align: center;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .4rem; }
    h1 span { color: var(--green); }
    .sub { color: var(--muted); font-size: 13px; }
    .error-msg { color: #f87171; font-size: 12px; margin-top: .75rem; max-width: 32rem; }
    .terminal-wrap {
      background: #000;
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
      padding: 8px;
    }
    #terminal { flex: 1; height: 100%; }
    .xterm { height: 100% !important; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">skyping</a>
  </nav>

  <div class="connect-wrap" id="connectWrap">
    <h1>Establishing <span>connection</span></h1>
    <p class="sub" id="statusText">Verifying encrypted session…</p>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="terminal-wrap" id="terminalWrap">
    <div id="terminal"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script>
    const statusText = document.getElementById('statusText');
    const connectWrap = document.getElementById('connectWrap');
    const terminalWrap = document.getElementById('terminalWrap');
    const errorMsg = document.getElementById('errorMsg');
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64UrlToUint8(value) {
      let normalized = value.replace(/-/g, '+').replace(/_/g, '/');
      normalized += '='.repeat((4 - normalized.length % 4) % 4);
      const binary = atob(normalized);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function concatBytes(...parts) {
      const length = parts.reduce((total, part) => total + part.length, 0);
      const combined = new Uint8Array(length);
      let offset = 0;
      for (const part of parts) {
        combined.set(part, offset);
        offset += part.length;
      }
      return combined;
    }

    async function proof(token, role, clientPublicKey, agentPublicKey) {
      const signingKey = await crypto.subtle.importKey(
        'raw', token, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
      );
      return new Uint8Array(await crypto.subtle.sign(
        'HMAC',
        signingKey,
        concatBytes(encoder.encode('skyping/v1/'), encoder.encode(role), clientPublicKey, agentPublicKey)
      ));
    }

    function fail(message) {
      statusText.textContent = 'Connection failed';
      errorMsg.textContent = message;
    }

    async function init() {
      try {
        const params = new URLSearchParams(window.location.hash.slice(1));
        const tunnelURL = decoder.decode(base64UrlToUint8(params.get('u') || ''));
        const agentPublicKey = base64UrlToUint8(params.get('k') || '');
        const token = base64UrlToUint8(params.get('t') || '');

        if (!tunnelURL || agentPublicKey.length === 0 || token.length !== 32) {
          throw new Error('This is not a valid Skyping share link.');
        }

        const endpoint = new URL(tunnelURL);
        if (endpoint.protocol !== 'https:') {
          throw new Error('The share link must use a secure HTTPS tunnel.');
        }
        endpoint.protocol = 'wss:';
        endpoint.pathname = `${endpoint.pathname.replace(/\/$/, '')}/ws`;
        endpoint.search = '';

        statusText.textContent = 'Generating an encrypted session…';
        const browserKeys = await crypto.subtle.generateKey(
          { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveKey']
        );
        const clientPublicKey = new Uint8Array(await crypto.subtle.exportKey('raw', browserKeys.publicKey));
        const agentKey = await crypto.subtle.importKey(
          'raw', agentPublicKey, { name: 'ECDH', namedCurve: 'P-256' }, false, []
        );
        const sharedKey = await crypto.subtle.deriveKey(
          { name: 'ECDH', public: agentKey },
          browserKeys.privateKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );

        const clientProof = await proof(token, 'client', clientPublicKey, agentPublicKey);
        const expectedServerProof = await proof(token, 'server', clientPublicKey, agentPublicKey);
        const ws = new WebSocket(endpoint.toString());
        ws.binaryType = 'arraybuffer';

        let connected = false;
        let term;
        let fitAddon;
        let messageQueue = Promise.resolve();

        ws.onopen = () => {
          statusText.textContent = 'Authenticating encrypted session…';
          ws.send(JSON.stringify({
            publicKey: bytesToBase64Url(clientPublicKey),
            proof: bytesToBase64Url(clientProof),
          }));
        };

        ws.onmessage = event => {
          messageQueue = messageQueue
            .then(() => handleMessage(event.data))
            .catch(error => {
              ws.close();
              fail(error.message || 'Unable to verify the remote session.');
            });
        };

        async function handleMessage(data) {
          if (!connected) {
            if (typeof data !== 'string') throw new Error('Invalid server handshake.');
            const hello = JSON.parse(data);
            const serverProof = base64UrlToUint8(hello.proof || '');
            if (!constantTimeEqual(serverProof, expectedServerProof)) {
              throw new Error('The remote session could not be verified.');
            }

            connected = true;
            connectWrap.style.display = 'none';
            terminalWrap.style.display = 'flex';
            term = new Terminal({
              cursorBlink: true,
              fontSize: 14,
              fontFamily: 'JetBrains Mono, monospace',
              theme: { background: '#000000', foreground: '#f5f5f5', cursor: '#4ade80' },
              scrollback: 5000,
            });
            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(document.getElementById('terminal'));
            fitAddon.fit();
            window.addEventListener('resize', () => fitAddon.fit());

            term.onData(async input => {
              if (ws.readyState !== WebSocket.OPEN) return;
              const iv = crypto.getRandomValues(new Uint8Array(12));
              const encrypted = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv }, sharedKey, encoder.encode(input)
              );
              ws.send(concatBytes(iv, new Uint8Array(encrypted)));
            });
            return;
          }

          if (!(data instanceof ArrayBuffer)) throw new Error('Invalid encrypted terminal data.');
          const payload = new Uint8Array(data);
          if (payload.length < 28) throw new Error('Invalid encrypted terminal data.');
          const plaintext = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: payload.slice(0, 12) }, sharedKey, payload.slice(12)
          );
          term.write(new Uint8Array(plaintext));
        }

        ws.onerror = () => fail('The encrypted tunnel could not be reached. Make sure the sharer is still running Skyping.');
        ws.onclose = () => {
          if (connected && term) term.write('\r\n\r\n\x1b[33mSession closed.\x1b[0m\r\n');
        };
      } catch (error) {
        fail(error.message || 'Unable to establish an encrypted session.');
      }
    }

    function bytesToBase64Url(bytes) {
      let binary = '';
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function constantTimeEqual(a, b) {
      if (a.length !== b.length) return false;
      let result = 0;
      for (let i = 0; i < a.length; i += 1) result |= a[i] ^ b[i];
      return result === 0;
    }

    init();
  </script>
</body>
</html>
